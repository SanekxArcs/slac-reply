<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Slack Quote Reply</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      background: #1a1d21;
      color: #d1d2d3;
    }

    header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid #2d2f33;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header svg { flex-shrink: 0; color: #7c8bff; }

    header h1 {
      font-size: 13px;
      font-weight: 600;
      color: #e8e8e8;
      letter-spacing: 0.01em;
    }

    .section {
      padding: 12px 16px;
      border-bottom: 1px solid #2d2f33;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 32px;
    }

    .row + .row { margin-top: 10px; }

    .label {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .label-text { color: #e8e8e8; font-weight: 500; }
    .label-sub  { font-size: 11px; color: #8a8e94; }

    /* Toggle */
    .toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
    .toggle-track {
      position: absolute; inset: 0;
      background: #3a3d43;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .toggle-track::after {
      content: '';
      position: absolute;
      top: 3px; left: 3px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #8a8e94;
      transition: transform 0.2s, background 0.2s;
    }
    .toggle input:checked + .toggle-track { background: #4a5af7; }
    .toggle input:checked + .toggle-track::after {
      transform: translateX(16px);
      background: #fff;
    }

    /* Number input row */
    .truncate-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 32px;
      margin-top: 10px;
      transition: opacity 0.15s;
    }
    .truncate-row.disabled { opacity: 0.35; pointer-events: none; }

    .number-wrap {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    input[type="number"] {
      width: 64px;
      background: #2d2f33;
      border: 1px solid #3a3d43;
      border-radius: 5px;
      color: #e8e8e8;
      font-size: 13px;
      padding: 4px 7px;
      text-align: right;
      outline: none;
      appearance: textfield;
    }
    input[type="number"]:focus { border-color: #4a5af7; }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

    .unit { color: #8a8e94; font-size: 11px; }

    footer {
      padding: 10px 16px;
      font-size: 11px;
      color: #5a5e64;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
      <path fill-rule="evenodd" d="M3.5 2.75a.75.75 0 0 0-1.5 0v14.5a.75.75 0 0 0 1.5 0zM6.75 3a.75.75 0 0 0 0 1.5h8.5a.75.75 0 0 0 0-1.5zM6 10.25a.75.75 0 0 1 .75-.75h10.5a.75.75 0 0 1 0 1.5H6.75a.75.75 0 0 1-.75-.75m.75 5.25a.75.75 0 0 0 0 1.5h7.5a.75.75 0 0 0 0-1.5z" clip-rule="evenodd"/>
    </svg>
    <h1>Slack Quote Reply</h1>
  </header>

  <div class="section">
    <div class="row">
      <div class="label">
        <span class="label-text">Include sender name</span>
        <span class="label-sub">Shows who wrote the quoted message</span>
      </div>
      <label class="toggle">
        <input type="checkbox" id="showName" checked>
        <span class="toggle-track"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="row">
      <div class="label">
        <span class="label-text">Truncate message</span>
        <span class="label-sub">Cut long messages in the quote</span>
      </div>
      <label class="toggle">
        <input type="checkbox" id="truncateEnabled">
        <span class="toggle-track"></span>
      </label>
    </div>
    <div class="truncate-row disabled" id="truncateRow">
      <span class="label-text">Max length</span>
      <div class="number-wrap">
        <input type="number" id="truncateChars" value="200" min="20" max="2000" step="10">
        <span class="unit">chars</span>
      </div>
    </div>
  </div>

  <footer>Changes apply immediately</footer>

  <script src="popup.js"></script>
</body>
</html>
